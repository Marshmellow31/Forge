name: CI

# Phase 0 deliverable 0.7: "typecheck + lint + unit + rules tests on every push".
#
# The rules job is the one that matters. A tenant leak is the single bug that
# ends this product, and the suite that catches it needs a Firestore emulator,
# which needs JDK 21 — so it runs in its own job with a JDK rather than being
# quietly dropped from CI because it is inconvenient.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch. Reviewers act on
# the latest result, so finishing the older one only costs minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if the lockfile and package.json disagree, so CI cannot silently
      # test a different dependency tree than the one that will ship.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # Two production deploys failed in a row on vercel.json, and neither was
      # visible locally — it is valid JSON that nothing imports and no test
      # touched. Vercel validating it was the first signal. Now this is.
      - name: Validate vercel.json
        run: npm run validate:vercel

      # The build is a real check: it catches things typecheck does not, such as
      # a dynamic import that cannot be resolved or a PWA manifest that fails to
      # generate.
      - name: Production build
        run: npm run build
        env:
          # Public Firebase config values. The app refuses to boot without them
          # (config/env.ts), and the build inlines them — so CI needs
          # placeholders. These never touch a real project.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ci'
          VITE_DEMO_ORG_ID: org_demo
          VITE_USE_EMULATOR: 'false'

  rules:
    name: Security rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator will not start on anything older.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Rules tests
        run: npm run test:rules

  functions:
    name: Cloud Functions (emulator)
    runs-on: ubuntu-latest
    # These cannot be deployed on the Spark plan, so without this job they would
    # only ever be typechecked. The emulator has no plan restriction, so it is
    # the only place their triggers can be proven to fire before billing is on.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm --prefix functions ci

      - name: Function trigger tests
        run: npm run test:functions
